<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Small-size master (favicons, 16–32 px): a brighter ramp and a solid
       live cell, because an outline blurs away below 32 px. -->
  <rect width="64" height="64" rx="14" fill="#171B25"/>
  <rect x="7" y="7" width="14" height="14" rx="3" fill="#5B45C9"/>
  <rect x="25" y="7" width="14" height="14" rx="3" fill="#8B7CFF"/>
  <rect x="43" y="7" width="14" height="14" rx="3" fill="#B4A8FF"/>
  <rect x="7" y="25" width="14" height="14" rx="3" fill="#8B7CFF"/>
  <rect x="25" y="25" width="14" height="14" rx="3" fill="#B4A8FF"/>
  <rect x="43" y="25" width="14" height="14" rx="3" fill="#5B45C9"/>
  <rect x="7" y="43" width="14" height="14" rx="3" fill="#B4A8FF"/>
  <rect x="25" y="43" width="14" height="14" rx="3" fill="#8B7CFF"/>
  <rect x="43" y="43" width="14" height="14" rx="3" fill="#F5B841"/>
</svg>
