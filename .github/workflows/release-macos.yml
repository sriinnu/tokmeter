# ============================================================================
# Release macOS Bar — build, sign, notarize, and publish
# ============================================================================
#
# Four jobs, each holding only what it needs. The point of the split: every
# step that executes third-party code (bun install, vite and its plugins,
# swift build) runs where there is nothing to steal, and the jobs that hold
# keys or write access run none of it.
#
#   verify-tag  Trusted `main` code checks the release: owner actor, a
#               GitHub-verified annotated tag signed by the approved SSH key,
#               pointing at a commit on main. Everything below builds,
#               signs and publishes only that commit.
#   build       UNPRIVILEGED. contents: read, no environment, no secrets.
#               Assembles the UNSIGNED .app (bundle.sh --unsigned) from the
#               verified commit, zips it, and publishes the zip's sha256 as
#               a job output next to the artifact.
#   sign        `release` environment: Developer ID, notary and Sparkle keys.
#               contents: read. Runs no bun/vite/swift build. Gets its own
#               sign_update from SwiftPM (pinned by Package.resolved, checksum
#               checked by SwiftPM), refuses an artifact whose sha256 differs
#               from build's output, signs with the hardened runtime
#               (sign-app.sh), notarizes, staples, Sparkle-signs the zip,
#               verifies that signature against the app's own SUPublicEDKey,
#               and writes + signs the appcast feed.
#   publish     contents: write + pull-requests: write. No signing secrets and
#               no repository code at all. Re-checks both sha256s, uploads the
#               zip, opens the appcast PR.
#
# Secrets (release environment, read only by `sign`):
#   APPLE_DEVELOPER_ID_P12        — .p12 cert, base64-encoded
#   APPLE_DEVELOPER_ID_PASSWORD   — password for the .p12
#   APP_STORE_CONNECT_API_KEY_P8  — App Store Connect API key
#   APP_STORE_CONNECT_KEY_ID      — API key ID
#   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID
#   SPARKLE_PRIVATE_KEY           — Ed25519 release key: signs the zip AND the feed
#   SPARKLE_PUBLIC_KEY            — Public key embedded in the app at signing time
#
# Missing signing, notarization, or Sparkle material is fatal. CI must never
# produce an artifact that looks like a release but lacks part of its trust chain.
# ============================================================================

name: Release macOS Bar

on:
  release:
    types: [created]

concurrency:
  group: release-macos-publish
  cancel-in-progress: false

env:
  APP_NAME: TokmeterBar
  BUNDLE_ID: com.sriinnu.tokmeterbar
  RELEASE_TAG: ${{ github.event.release.tag_name }}

# Nothing by default; every job states its own.
permissions: {}

jobs:
  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release-tag.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify signed release tag is on main
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
        run: scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # verify-release-tag.sh has already required vX.Y.Z.
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build unsigned app (no secrets)
    needs: verify-tag
    # macos-14's SDK predates SwiftUI 6 (`onGeometryChange`). Pinned to an
    # explicit image rather than macos-latest: a release pipeline should not
    # change toolchains underneath you.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.package.outputs.commit }}
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      # bundle.sh builds the in-app web dashboard with `bunx vite build`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle unsigned .app
        working-directory: packages/macos-bar
        env:
          CFBundleShortVersionString: ${{ needs.verify-tag.outputs.version }}
          # CFBundleVersion deliberately NOT set: bundle.sh's committed
          # BUILD_VERSION is the single source of truth, and scripts/bump-version.sh
          # advances it monotonically. github.run_number counts workflow runs and
          # has no relationship to release history — using it stamped build 26 onto
          # 1.12.0 when 1.11.0 had shipped as 48, which Sparkle reads as a
          # downgrade and never offers. `sign` re-checks it against bundle.sh.
        run: ./bundle.sh --unsigned --no-install

      - name: Package unsigned app
        id: package
        working-directory: packages/macos-bar
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          [[ "$COMMIT" == "$RELEASE_COMMIT" ]] || {
            echo "::error::checked-out commit is not the verified release commit" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/unsigned"
          ZIP="$RUNNER_TEMP/unsigned/${APP_NAME}-unsigned.zip"
          # ditto keeps Sparkle.framework's symlinks and modes; upload-artifact
          # alone would flatten them. bundle.sh assembles the app under
          # build.noindex/ (Spotlight skips it); --keepParent archives the
          # bundle directory itself, so the zip root is still ${APP_NAME}.app/.
          /usr/bin/ditto --norsrc -c -k --keepParent "build.noindex/${APP_NAME}.app" "$ZIP"
          {
            echo "commit=${COMMIT}"
            echo "sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
            echo "artifact=${APP_NAME}-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/unsigned/${{ env.APP_NAME }}-unsigned.zip
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign, notarize, Sparkle-sign
    needs: [verify-tag, build]
    # Required, not optional: the "release" environment only deploys from main
    # and v* tags, and it holds the signing/notary secrets. Removing or renaming
    # it lets any branch's run read them. Configured in Settings → Environments.
    environment: release
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.digests.outputs.artifact }}
      zip-name: ${{ steps.digests.outputs.zip-name }}
      zip-sha256: ${{ steps.digests.outputs.zip-sha256 }}
      appcast-sha256: ${{ steps.digests.outputs.appcast-sha256 }}
      appcast-base: ${{ steps.digests.outputs.appcast-base }}
      build-num: ${{ steps.digests.outputs.build-num }}
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
      RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
      BUILT_COMMIT: ${{ needs.build.outputs.commit }}
      UNSIGNED_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      # The verified commit supplies only trusted inputs here: sign-app.sh,
      # entitlements.plist, bundle.sh's BUILD_VERSION and Package.resolved.
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      # Never take sign_update from the build artifact: it would run with the
      # Sparkle private key. SwiftPM fetches the Sparkle release pinned in
      # Package.resolved and checks its binary-artifact checksum. Runs before
      # any secret or keychain exists in this job.
      - name: Fetch sign_update pinned by Package.resolved
        working-directory: packages/macos-bar
        run: |
          set -euo pipefail
          swift package --disable-automatic-resolution resolve
          SIGN_TOOL="$PWD/.build/artifacts/sparkle/Sparkle/bin/sign_update"
          [[ -x "$SIGN_TOOL" ]] || {
            echo "::error::Sparkle sign_update was not fetched" >&2
            exit 1
          }
          echo "SIGN_TOOL=$SIGN_TOOL" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD \
            APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret ${name} is missing" >&2
              exit 1
            fi
          done
          echo "All release signing inputs are present."

      - name: Download unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/unsigned

      # Sign only what `build` produced from the verified commit: same commit,
      # same bytes as the sha256 it recorded, and the identity, version and
      # build number the verified source says it must have.
      - name: Verify and unpack the unsigned app
        run: |
          set -euo pipefail
          [[ "$BUILT_COMMIT" == "$RELEASE_COMMIT" ]] || {
            echo "::error::build job built ${BUILT_COMMIT}, not the verified ${RELEASE_COMMIT}" >&2
            exit 1
          }
          ZIP="$RUNNER_TEMP/unsigned/${APP_NAME}-unsigned.zip"
          [[ "$UNSIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::build job reported no artifact digest" >&2
            exit 1
          }
          ACTUAL="$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
          [[ "$ACTUAL" == "$UNSIGNED_SHA256" ]] || {
            echo "::error::unsigned artifact sha256 ${ACTUAL} != build output ${UNSIGNED_SHA256}" >&2
            exit 1
          }

          # Every entry must sit inside TokmeterBar.app/ — no absolute paths,
          # no "..", nothing beside the bundle.
          python3 -I - "$ZIP" "${APP_NAME}.app/" <<'PY'
          import pathlib, sys, zipfile
          archive, prefix = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or not (name + "/").startswith(prefix):
                      raise SystemExit(f"unexpected entry in unsigned artifact: {name!r}")
          PY
          WORK="$RUNNER_TEMP/app"
          rm -rf "$WORK" && mkdir -p "$WORK"
          /usr/bin/ditto -x -k "$ZIP" "$WORK"
          APP_PATH="$WORK/${APP_NAME}.app"
          [[ "$(ls -A "$WORK")" == "${APP_NAME}.app" && -d "$APP_PATH" ]] || {
            echo "::error::artifact did not unpack to exactly ${APP_NAME}.app" >&2
            exit 1
          }

          PLIST="$APP_PATH/Contents/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          EXPECTED_BUILD="$(grep -E '^BUILD_VERSION=' packages/macos-bar/bundle.sh | grep -oE '[0-9]+' | head -1)"
          [[ "$(pb CFBundleIdentifier)" == "$BUNDLE_ID" ]] || { echo "::error::wrong CFBundleIdentifier" >&2; exit 1; }
          [[ "$(pb CFBundleExecutable)" == "$APP_NAME" ]] || { echo "::error::wrong CFBundleExecutable" >&2; exit 1; }
          [[ "$(pb CFBundleShortVersionString)" == "$VERSION" ]] || { echo "::error::app version is not ${VERSION}" >&2; exit 1; }
          [[ -n "$EXPECTED_BUILD" && "$(pb CFBundleVersion)" == "$EXPECTED_BUILD" ]] || {
            echo "::error::CFBundleVersion does not match bundle.sh BUILD_VERSION at the verified commit" >&2
            exit 1
          }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "BUILD_NUM=$EXPECTED_BUILD" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERT_PATH=$(mktemp "$RUNNER_TEMP/tokmeter-cert.XXXXXX")
          trap 'rm -f "$CERT_PATH"' EXIT

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          DEV_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          [[ -n "$DEV_ID" ]] || { echo "::error::Developer ID identity not found" >&2; exit 1; }
          echo "::add-mask::$DEV_ID"
          echo "DEV_ID=$DEV_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # sign-app.sh embeds SUPublicEDKey (the build job never had it), refuses
      # an Info.plist without the Sparkle hardening keys, signs nested Sparkle
      # code then the app with the hardened runtime + secure timestamp, and
      # asserts both on the result.
      - name: Sign the app (Developer ID, hardened runtime)
        env:
          SUPUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: bash packages/macos-bar/sign-app.sh "$APP_PATH"

      - name: Notarize and staple
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH=$(mktemp "$RUNNER_TEMP/tokmeter-api-key.XXXXXX")
          NOTARIZE_ZIP=$(mktemp "$RUNNER_TEMP/tokmeter-notarize.XXXXXX")
          trap 'rm -f "$API_KEY_PATH" "$NOTARIZE_ZIP"' EXIT
          API_KEY_CONTENT="${APP_STORE_CONNECT_API_KEY_P8//\\n/$'\n'}"
          printf '%s' "$API_KEY_CONTENT" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          unset API_KEY_CONTENT

          /usr/bin/ditto --norsrc -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          spctl -a -t exec -vv "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Create distribution zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed"
          ZIP_NAME="${APP_NAME}-${VERSION}.zip"
          ZIP_PATH="$RUNNER_TEMP/signed/$ZIP_NAME"
          /usr/bin/ditto --norsrc -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Sign the zip with Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_KEY_PATH=$(mktemp "$RUNNER_TEMP/tokmeter-sparkle.XXXXXX")
          trap 'rm -f "$SPARKLE_KEY_PATH"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_PATH"
          chmod 600 "$SPARKLE_KEY_PATH"
          ED_SIG=$("$SIGN_TOOL" -f "$SPARKLE_KEY_PATH" "$ZIP_PATH")
          if [[ -z "$ED_SIG" ]]; then
            echo "::error::Sparkle produced an empty signature" >&2
            exit 1
          fi
          echo "ED_SIG=${ED_SIG}" >> "$GITHUB_ENV"

      # A wrong SPARKLE_PRIVATE_KEY cannot fail the build — sign_update happily
      # signs with any key. It fails silently later, on every user's machine,
      # when Sparkle rejects the signature and auto-update stops working. This
      # has bitten before (a key in the Keychain that was not the release key).
      #
      # So verify the signature exactly the way the user's Sparkle will: Ed25519
      # over the zip bytes against the SUPublicEDKey embedded in the app we just
      # signed. That round-trip catches a wrong private key, a wrong public key,
      # and a zip mutated after signing. Comparing key strings would catch only
      # the second.
      - name: Verify the Sparkle signature against the app's own key
        run: |
          set -euo pipefail
          PUBKEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP_PATH/Contents/Info.plist")"
          # shellcheck disable=SC2016
          SUPUB="$PUBKEY" ED_SIG="$ED_SIG" ZIP="$ZIP_PATH" node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const pub = Buffer.from(process.env.SUPUB ?? "", "base64");
            if (pub.length !== 32) {
              throw new Error(`SUPublicEDKey decodes to ${pub.length} bytes, expected 32 — the app has no usable update key`);
            }
            // ED_SIG is the whole attribute string: sparkle:edSignature="…" length="…"
            const found = /edSignature="([^"]+)"/.exec(process.env.ED_SIG ?? "");
            if (!found) throw new Error("could not find edSignature in the signing output");
            const sig = Buffer.from(found[1], "base64");
            // Raw Ed25519 public keys need an SPKI wrapper for createPublicKey.
            const der = Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), pub]);
            const key = crypto.createPublicKey({ key: der, format: "der", type: "spki" });
            if (!crypto.verify(null, fs.readFileSync(process.env.ZIP), key, sig)) {
              throw new Error(
                "Sparkle signature does NOT validate against the SUPublicEDKey in this build. " +
                  "SPARKLE_PRIVATE_KEY is not the key this app trusts — shipping it would break " +
                  "auto-update for every existing user.",
              );
            }
            console.log("Sparkle signature validates against the app'"'"'s SUPublicEDKey.");
          '

      - name: Validate Sparkle build number before publishing bytes
        if: vars.CI_PUBLISH == 'true'
        run: |
          set -euo pipefail
          [[ "$BUILD_NUM" =~ ^[0-9]+$ ]] || {
            echo "::error::invalid CFBundleVersion" >&2
            exit 1
          }
          git fetch origin main
          APPCAST_BASE="$(git rev-parse origin/main)"
          PREV_BUILD="$(git show "${APPCAST_BASE}:packages/macos-bar/appcast.xml" \
            | grep -oE '<sparkle:version>[0-9]+</sparkle:version>' \
            | head -1 | tr -dc '0-9')"
          if [[ -n "$PREV_BUILD" && "$BUILD_NUM" -le "$PREV_BUILD" ]]; then
            echo "::error::build number is not newer than the published appcast; bump BUILD_VERSION in bundle.sh" >&2
            exit 1
          fi
          echo "APPCAST_BASE=$APPCAST_BASE" >> "$GITHUB_ENV"

      # Sparkle resolves new versions from packages/macos-bar/appcast.xml on
      # main. Builds carry SURequireSignedFeed (bundle.sh), so the feed itself
      # is signed with the release key: sign_update replaces the trailing
      # sparkle-signatures block with one over the new bytes. `publish` only
      # commits these exact bytes (sha256-checked); it cannot re-sign.
      # Gated on CI_PUBLISH like the upload: one publisher per release.
      - name: Write and sign the appcast feed
        if: vars.CI_PUBLISH == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APPCAST="$RUNNER_TEMP/signed/appcast.xml"
          git show "${APPCAST_BASE}:packages/macos-bar/appcast.xml" > "$APPCAST"

          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP_NAME}"
          # ED_SIG already contains sparkle:edSignature="…" length="…" as one
          # attribute string, ready to drop into the enclosure tag.
          APPCAST="$APPCAST" PUB_DATE="$PUB_DATE" ZIP_URL="$ZIP_URL" python3 -I - <<'PY'
          import os, re, pathlib
          path = pathlib.Path(os.environ["APPCAST"])
          xml = path.read_text()
          version    = os.environ["VERSION"]
          build_num  = os.environ["BUILD_NUM"]
          pub_date   = os.environ["PUB_DATE"]
          zip_url    = os.environ["ZIP_URL"]
          ed_sig     = os.environ["ED_SIG"]
          tag        = os.environ["RELEASE_TAG"]
          repo       = os.environ["GITHUB_REPOSITORY"]

          # Idempotency — skip if this version is already in the feed.
          if f"<sparkle:shortVersionString>{version}</sparkle:shortVersionString>" in xml:
              print(f"appcast.xml already has {version}, skipping insert")
              path.unlink()
              raise SystemExit(0)

          # A hand edit silently breaks updates for every SURequireSignedFeed
          # install, so say so in the file itself (once).
          marker = "<!-- Signed Sparkle feed."
          if marker not in xml:
              note = (
                  f"{marker} TokmeterBar builds with SURequireSignedFeed reject this file "
                  "unless the signature comment Sparkle appends at the end matches its exact bytes. "
                  "Change it only through release-macos.yml, or re-sign it with Sparkle's "
                  "sign_update and the release key. -->\n"
              )
              decl = re.match(r"<\?xml[^>]*\?>\n", xml)
              at = decl.end() if decl else 0
              xml = xml[:at] + note + xml[at:]

          item = (
              "        <item>\n"
              f"            <title>TokmeterBar {version}</title>\n"
              f"            <pubDate>{pub_date}</pubDate>\n"
              f"            <sparkle:version>{build_num}</sparkle:version>\n"
              f"            <sparkle:shortVersionString>{version}</sparkle:shortVersionString>\n"
              "            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>\n"
              f"            <description>&lt;p&gt;See release notes at &lt;a href=\"https://github.com/{repo}/releases/tag/{tag}\"&gt;{tag}&lt;/a&gt;.&lt;/p&gt;</description>\n"
              f'            <enclosure url="{zip_url}" type="application/octet-stream" {ed_sig} />\n'
              "        </item>\n"
          )

          # Insert directly after <language>…</language> (top of channel).
          new_xml, n = re.subn(
              r"(<language>[^<]*</language>\n)",
              lambda m: m.group(1) + item,
              xml,
              count=1,
          )
          if n != 1:
              raise SystemExit("ERROR: could not locate <language> anchor in appcast.xml")
          path.write_text(new_xml)
          print(f"Inserted {version} (build {build_num}) into appcast.xml")
          PY

          if [[ ! -f "$APPCAST" ]]; then
            echo "appcast.xml already current — no feed change to publish"
            exit 0
          fi

          SPARKLE_KEY_PATH=$(mktemp "$RUNNER_TEMP/tokmeter-sparkle.XXXXXX")
          trap 'rm -f "$SPARKLE_KEY_PATH"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_PATH"
          chmod 600 "$SPARKLE_KEY_PATH"
          # --disable-signing-warning: otherwise sign_update re-serialises the
          # whole document (every <enclosure/> rewritten) to add its comment;
          # the marker above says the same thing without the churn.
          "$SIGN_TOOL" -f "$SPARKLE_KEY_PATH" --disable-signing-warning "$APPCAST"

      # Same round-trip as the zip: verify the feed the way Sparkle will
      # (SPUExtractAppcastContent + Ed25519 over the content bytes) against the
      # SUPublicEDKey in the app we signed, before anything is published.
      - name: Verify the feed signature against the app's own key
        if: vars.CI_PUBLISH == 'true'
        run: |
          set -euo pipefail
          APPCAST="$RUNNER_TEMP/signed/appcast.xml"
          [[ -f "$APPCAST" ]] || { echo "No feed change; nothing to verify."; exit 0; }
          PUBKEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP_PATH/Contents/Info.plist")"
          # shellcheck disable=SC2016
          SUPUB="$PUBKEY" APPCAST="$APPCAST" node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const data = fs.readFileSync(process.env.APPCAST);
            const prefix = Buffer.from("<!-- sparkle-signatures:\n");
            const at = data.lastIndexOf(prefix);
            if (at < 0) throw new Error("appcast has no sparkle-signatures block");
            const end = data.indexOf("-->", at + prefix.length);
            if (end < 0) throw new Error("unterminated sparkle-signatures block");
            if (data.subarray(end + 3).toString().trim() !== "") {
              throw new Error("content follows the sparkle-signatures block");
            }
            const block = data.subarray(at + prefix.length, end).toString();
            const sig = /^edSignature:\s*(\S+)\s*$/m.exec(block)?.[1];
            const length = Number(/^length:\s*(\d+)\s*$/m.exec(block)?.[1]);
            const content = data.subarray(0, at);
            if (!sig) throw new Error("no edSignature in the feed block");
            if (length !== content.length) {
              throw new Error(`feed block says ${length} bytes, content is ${content.length}`);
            }
            const pub = Buffer.from(process.env.SUPUB ?? "", "base64");
            if (pub.length !== 32) throw new Error("SUPublicEDKey is not a 32-byte key");
            const der = Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), pub]);
            const key = crypto.createPublicKey({ key: der, format: "der", type: "spki" });
            if (!crypto.verify(null, content, key, Buffer.from(sig, "base64"))) {
              throw new Error("appcast feed signature does NOT validate against the app'"'"'s SUPublicEDKey");
            }
            console.log("Appcast feed signature validates against the app'"'"'s SUPublicEDKey.");
          '

      - name: Record signed artifact digests
        id: digests
        run: |
          set -euo pipefail
          APPCAST="$RUNNER_TEMP/signed/appcast.xml"
          APPCAST_SHA=""
          [[ -f "$APPCAST" ]] && APPCAST_SHA="$(shasum -a 256 "$APPCAST" | cut -d' ' -f1)"
          {
            echo "artifact=${APP_NAME}-signed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "zip-name=${ZIP_NAME}"
            echo "zip-sha256=$(shasum -a 256 "$ZIP_PATH" | cut -d' ' -f1)"
            echo "appcast-sha256=${APPCAST_SHA}"
            echo "appcast-base=${APPCAST_BASE:-}"
            echo "build-num=${BUILD_NUM}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.digests.outputs.artifact }}
          path: |
            ${{ runner.temp }}/signed/${{ steps.digests.outputs.zip-name }}
            ${{ runner.temp }}/signed/appcast.xml
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # PUBLISH IS OPT-IN (vars.CI_PUBLISH == 'true'; on since 1.12.0). CI is the
  # sole publisher: a second, locally built zip differs byte-for-byte, so the
  # appcast signature would stop validating and every user's auto-update would
  # fail. No --clobber anywhere: a stray rerun must not replace a published
  # asset with different bytes.
  publish:
    name: Upload zip and open appcast PR
    needs: [verify-tag, sign]
    if: vars.CI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # The appcast step opens a PR rather than pushing to protected main;
      # without this it fails with "Resource not accessible by integration".
      pull-requests: write
    env:
      ZIP_NAME: ${{ needs.sign.outputs.zip-name }}
      ZIP_SHA256: ${{ needs.sign.outputs.zip-sha256 }}
      APPCAST_SHA256: ${{ needs.sign.outputs.appcast-sha256 }}
      APPCAST_BASE: ${{ needs.sign.outputs.appcast-base }}
      BUILD_NUM: ${{ needs.sign.outputs.build-num }}
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.outputs.artifact }}
          path: ${{ runner.temp }}/signed

      - name: Verify signed artifacts are the bytes sign produced
        run: |
          set -euo pipefail
          [[ "$ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no zip digest from sign" >&2; exit 1; }
          echo "${ZIP_SHA256}  ${RUNNER_TEMP}/signed/${ZIP_NAME}" | sha256sum -c -
          if [[ -n "$APPCAST_SHA256" ]]; then
            [[ "$APPCAST_SHA256" =~ ^[0-9a-f]{64}$ && "$APPCAST_BASE" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::malformed appcast digest or base from sign" >&2
              exit 1
            }
            echo "${APPCAST_SHA256}  ${RUNNER_TEMP}/signed/appcast.xml" | sha256sum -c -
          fi

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="${RUNNER_TEMP}/signed/${ZIP_NAME}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -qxF "$ZIP_NAME"; then
            # Rerun after a successful upload: fine only if it is these bytes.
            CHECK_DIR="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p "$ZIP_NAME" -D "$CHECK_DIR"
            echo "${ZIP_SHA256}  ${CHECK_DIR}/${ZIP_NAME}" | sha256sum -c - || {
              echo "::error::${ZIP_NAME} is already on ${RELEASE_TAG} with different bytes; refusing to replace it" >&2
              exit 1
            }
            echo "${ZIP_NAME} already uploaded with identical bytes."
          else
            gh release upload "$RELEASE_TAG" "$ZIP" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Open the appcast PR
        if: needs.sign.outputs.appcast-sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Main requires signed commits and PRs, and this job has no git
          # checkout at all. Commit through the contents API: GitHub signs API
          # commits made with the workflow token, so the PR is mergeable as-is.
          # The branch starts at the exact main commit the feed was built from;
          # if main's appcast moved since, the PR conflicts instead of
          # silently dropping an entry.
          BRANCH="release/appcast-${RELEASE_TAG}"
          FILE=packages/macos-bar/appcast.xml
          BASE_BLOB="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=${APPCAST_BASE}" --jq '.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="${APPCAST_BASE}" >/dev/null
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${FILE}" \
            -f message="chore(appcast): add ${RELEASE_TAG} (build ${BUILD_NUM})" \
            -f content="$(base64 < "${RUNNER_TEMP}/signed/appcast.xml" | tr -d '\n')" \
            -f sha="${BASE_BLOB}" \
            -f branch="${BRANCH}" \
            --jq '.commit.verification.verified' | grep -qx true \
            || { echo "::error::appcast commit is not signed; its PR could not merge" >&2; exit 1; }

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "chore(appcast): add ${RELEASE_TAG} entry" \
            --body "Auto-generated by release-macos.yml after signing and notarizing ${RELEASE_TAG}. Adds the Sparkle appcast item and re-signs the feed (SURequireSignedFeed) so existing TokmeterBar users see the update on next poll. The zip is already attached to release ${RELEASE_TAG}. Do not edit this file by hand: any change invalidates the feed signature." \
            --base main \
            --head "${BRANCH}"

          # Best-effort auto-merge — succeeds when the repo has auto-merge
          # enabled AND the PR satisfies branch protection. Falls through
          # quietly otherwise; scripts/release.sh verifies and merges it.
          gh pr merge "${BRANCH}" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch || true
