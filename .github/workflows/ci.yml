name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The release script is rerunnable stage by stage; a missed key tap or a
      # red CI run must resume, not redo or refuse (1.16.1 died on a tap that
      # went to another repo's commit).
      - name: Release flow
        run: bash scripts/test/release-flow.test.sh

      # Tests run under Bun; users run Node. A Node-only API imported at module
      # top level (zstd, 22.15+) once stopped the CLI from starting on Node 20.
      - name: Setup oldest supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: CLI and MCP load on Node 20
        run: |
          node packages/tokmeter/dist/cli/cli.js --version
          node packages/mcp/dist/cli.js --version

  # Windows is not a supported platform yet. This job exists to show what
  # breaks before any Windows app work starts. It is not a required check, so
  # a red run reports problems without blocking a PR.
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # 51 tests in 10 files still assume a Unix box (the sqlite3 CLI, tar
      # with C: paths, path separators in restore-guard): visible here, but
      # not failing the job until they're fixed, so the real-run step below
      # gets to run.
      - name: Test (known Windows gaps, not yet gating)
        continue-on-error: true
        run: bun run test

      - name: Setup oldest supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      # A real run, not just --version: an empty home must report no usage
      # rather than crash on a path or a missing directory.
      - name: CLI and MCP run on Node 20
        env:
          HOME: ${{ runner.temp }}/empty-home
          USERPROFILE: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          node packages/tokmeter/dist/cli/cli.js --version
          node packages/mcp/dist/cli.js --version
          node packages/tokmeter/dist/cli/cli.js --today --json --light

  native-build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, test, and render native fixtures
        env:
          TOKMETER_UI_QA_DIR: ${{ runner.temp }}/tokmeter-native-qa
        run: |
          mkdir -p "$TOKMETER_UI_QA_DIR"
          swift test --package-path packages/macos-bar
