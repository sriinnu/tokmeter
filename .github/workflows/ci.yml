name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A stray `||||||| b8b60a3` from a resolved merge shipped in CHANGELOG
      # through three releases (1.19.5–1.19.7) and into release notes; no other
      # check reads Markdown. `=======` is left out: it is also a heading rule.
      - name: No merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|\|\|\|\|\|\|\||>>>>>>>)( |$)'; then
            echo "::error::merge-conflict markers in tracked files"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Secret guard
        run: bash scripts/check-no-secrets.sh

      - name: Lint
        run: bun run lint

      - name: MCP tool docs match the server
        run: node scripts/sync-mcp-tool-docs.mjs --check

      - name: Test
        run: bun run test

      # The release script is rerunnable stage by stage; a missed key tap or a
      # red CI run must resume, not redo or refuse (1.16.1 died on a tap that
      # went to another repo's commit).
      - name: Release flow
        run: bash scripts/test/release-flow.test.sh

      - name: Secret guard tests
        run: bash scripts/test/check-no-secrets.test.sh

      # Feature PRs merge through scripts/merge-pr.sh so main gets no
      # Co-authored-by trailers from GitHub's default squash message.
      - name: Merge script
        run: bash scripts/test/merge-pr.test.sh

      # Tests run under Bun; users run Node. A Node-only API imported at module
      # top level (zstd, 22.15+) once stopped the CLI from starting on Node 20.
      - name: Setup oldest supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: CLI and MCP load on Node 22
        run: |
          # A real version, not the "latest" fallback a path bug once gave.
          node packages/tokmeter/dist/cli/cli.js --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          node packages/mcp/dist/cli.js --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'

      # The independent Codex oracle (python, no tokmeter imports) judges the
      # built parser on hand-worked fixtures. Its KNOWN_BUGS list must still
      # fail and every other fixture must pass, so a parser fix that lands
      # without updating the list, or a regression, turns this red. It was
      # run only by hand before.
      - name: Codex oracle fixtures
        run: node scripts/oracle/test-fixtures.mjs

      - name: Claude oracle fixtures
        run: node scripts/oracle/test-claude-fixtures.mjs

      - name: Oracle Python syntax check
        run: python3 -m py_compile scripts/oracle/codex_oracle.py scripts/oracle/antigravity_oracle.py scripts/oracle/claude_oracle.py

  # Windows is not a supported platform yet. This job exists to show what
  # breaks before any Windows app work starts. It is not a required check, so
  # a red run reports problems without blocking a PR.
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # 51 tests in 10 files still assume a Unix box (the sqlite3 CLI, tar
      # with C: paths, path separators in restore-guard): visible here, but
      # not failing the job until they're fixed, so the real-run step below
      # gets to run.
      - name: Test (known Windows gaps, not yet gating)
        continue-on-error: true
        run: bun run test

      - name: Setup oldest supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # A real run, not just --version: an empty home must report no usage
      # rather than crash on a path or a missing directory.
      - name: CLI and MCP run on Node 22
        env:
          HOME: ${{ runner.temp }}/empty-home
          USERPROFILE: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          node packages/tokmeter/dist/cli/cli.js --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          node packages/mcp/dist/cli.js --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          node packages/tokmeter/dist/cli/cli.js --today --json --light

  native-build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, test, and render native fixtures
        env:
          TOKMETER_UI_QA_DIR: ${{ runner.temp }}/tokmeter-native-qa
        run: |
          mkdir -p "$TOKMETER_UI_QA_DIR"
          swift test --package-path packages/macos-bar
