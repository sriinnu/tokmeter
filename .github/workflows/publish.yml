# ============================================================================
# Publish monorepo packages to npm with provenance on Release
# ============================================================================
#
# Adapted from the standalone workflow used in runic, kosha-discovery, etc.
# Extended for bun monorepo with multiple publishable packages.
#
# AUTHENTICATION: npm Trusted Publishing (OIDC) — no token.
#
# The job's own OIDC identity proves it is this workflow in this repo, so
# there is no NPM_TOKEN to store, rotate or leak, and it works with 2FA
# required on writes. npm is removing token-based direct publishing in
# January 2027, so this is also the path that keeps working.
#
# One-time setup, per package (@sriinnu/tokmeter and @sriinnu/tokmeter-mcp):
#   npmjs.com → package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: sriinnu
#     Repository:           tokmeter
#     Workflow filename:    publish.yml
#
# Requires npm >= 11.5.1 (installed below) and Node >= 22.14.
#
# To publish: bump versions → commit → create GitHub Release → workflow runs.
# ============================================================================

name: Release & Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job 1: Verify — build, lint, and test must pass before publishing
  # ==========================================================================
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release-tag.outputs.commit }}
    steps:
      - name: Checkout trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify signed release tag is on main
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
        run: scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.release-tag.outputs.commit }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Verify package versions match the signed release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.RELEASE_TAG.replace(/^v/, "");
          const tokmeter = require("./packages/tokmeter/package.json");
          const mcp = require("./packages/mcp/package.json");
          const server = JSON.parse(fs.readFileSync("./packages/mcp/server.json", "utf8"));
          const versions = [tokmeter.version, mcp.version, server.version, server.packages[0].version];
          if (versions.some((version) => version !== expected)) {
            throw new Error(`release ${expected} does not match package versions: ${versions.join(", ")}`);
          }
          NODE

      - name: Prepare verified package artifacts
        run: bash scripts/prepare-packages.sh "$RUNNER_TEMP/tokmeter-packages"

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/tokmeter-packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # Job 2: Publish — only after verify succeeds
  # ==========================================================================
  publish:
    name: Publish to npm (with provenance)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.release_commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download verified package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/tokmeter-packages

      # Trusted Publishing authenticates via the job's OIDC token instead of
      # an NPM_TOKEN. It needs npm >= 11.5.1, and Node 22 still ships npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@12.2.1
          npm --version

      - name: Prepare and publish verified package artifacts
        run: |
          set -euo pipefail
          for package in tokmeter mcp; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            artifact="$RUNNER_TEMP/tokmeter-packages/$package-$version.tgz"
            # A local signed release can publish npm before creating the
            # GitHub release. Tar/gzip metadata is not reproducible across
            # `bun pm pack` invocations, so compare the actual package tree
            # fetched under npm's dist.integrity instead of raw tgz bytes.
            if npm view "$name@$version" version 2>/dev/null | grep -Fx "$version"; then
              remote_integrity=$(npm view "$name@$version" dist.integrity)
              [[ -n "$remote_integrity" ]] || {
                echo "::error::$name@$version has no registry integrity" >&2
                exit 1
              }
              # npm 12 wraps `npm view <field> --json` in an array; npm 11
              # returned the bare object. Accept both, or a rerun of a
              # published release dies here ("Cannot index array with
              # string "url"", v1.19.7).
              attestations=$(npm view "$name@$version" dist.attestations --json 2>/dev/null || true)
              attestation='if type == "array" then .[0] else . end'
              provenance_url=$(jq -r "$attestation | .url // empty" <<<"$attestations")
              predicate_type=$(jq -r "$attestation | .provenance.predicateType // empty" <<<"$attestations")
              [[ -n "$provenance_url" && "$predicate_type" == "https://slsa.dev/provenance/v1" ]] || {
                echo "::error::$name@$version exists without expected SLSA provenance" >&2
                exit 1
              }
              compare_dir=$(mktemp -d "$RUNNER_TEMP/tokmeter-published.XXXXXX")
              mkdir -p "$compare_dir/local" "$compare_dir/remote" "$compare_dir/download"
              npm pack "$name@$version" --ignore-scripts --pack-destination "$compare_dir/download" >/dev/null
              published_artifact=$(find "$compare_dir/download" -type f -name '*.tgz' -print -quit)
              [[ -n "$published_artifact" ]] || {
                echo "::error::could not download $name@$version for verification" >&2
                exit 1
              }
              python3 - "$artifact" "$published_artifact" <<'PY'
          import pathlib, sys, tarfile

          for archive in sys.argv[1:]:
              with tarfile.open(archive, "r:gz") as bundle:
                  for member in bundle.getmembers():
                      path = pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or ".." in path.parts or member.isdev():
                          raise SystemExit(f"unsafe package archive member in {archive}")
                      if member.issym() or member.islnk():
                          target = pathlib.PurePosixPath(member.linkname)
                          resolved = path.parent.joinpath(target)
                          if target.is_absolute() or ".." in resolved.parts:
                              raise SystemExit(f"unsafe package archive link in {archive}")
          PY
              tar -xzf "$artifact" --no-same-owner -C "$compare_dir/local"
              tar -xzf "$published_artifact" --no-same-owner -C "$compare_dir/remote"
              diff -qr --no-dereference "$compare_dir/local" "$compare_dir/remote" || {
                echo "::error::$name@$version exists with different package contents" >&2
                exit 1
              }
              echo "$name@$version is already published"
              continue
            fi
            npm publish "$artifact" --provenance --access public
          done

      # ======================================================================
      # Publish the MCP server manifest to the official registry.
      #
      # Runs AFTER npm publish on purpose: the registry proves namespace
      # ownership by fetching the published package and reading `mcpName`
      # out of its package.json, so the version has to exist on npm first.
      # Auth is the job's own OIDC token (`id-token: write` above) — it
      # proves the io.github.sriinnu/* namespace, so there is no interactive
      # login and no secret to rotate.
      # ======================================================================
      - name: Publish to the MCP registry
        working-directory: packages/mcp
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              ASSET=mcp-publisher_linux_amd64.tar.gz
              EXPECTED_SHA=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
              ;;
            aarch64|arm64)
              ASSET=mcp-publisher_linux_arm64.tar.gz
              EXPECTED_SHA=8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4
              ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ASSET}" \
            -o /tmp/mcp-publisher.tar.gz
          echo "${EXPECTED_SHA}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          # server.json pins its own version; fail loudly rather than
          # registering a manifest that points at a different release.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_TAG.replace(/^v/, "");
            const seen = [srv.version, srv.packages[0].version, pkg.version];
            if (seen.some((v) => v !== tag)) {
              throw new Error(`version mismatch: tag ${tag} vs ${seen.join(", ")}`);
            }
            if (pkg.mcpName !== srv.name) {
              throw new Error(`mcpName ${pkg.mcpName} does not match server name ${srv.name}`);
            }
            if (srv.packages[0].identifier !== pkg.name) {
              throw new Error(`server.json package ${srv.packages[0].identifier} is not ${pkg.name}`);
            }
            // The registry caps description at 100 chars and rejects the
            // whole manifest with a 422 — after npm has already published,
            // so the release is half-done. Catch it before we get there.
            if ((srv.description ?? "").length > 100) {
              throw new Error(`server.json description is ${srv.description.length} chars; the registry allows 100`);
            }
          '
          # npm's read API lags its own publish, and the registry resolves
          # the version before it will register anything. Wait for the
          # version to be readable instead of racing it. Five minutes wasn't
          # enough for v1.19.7 ("did not appear on npm within 5 minutes",
          # listed a few minutes later), so wait up to fifteen.
          PKG_VERSION="${RELEASE_TAG#v}"
          for attempt in $(seq 1 90); do
            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::${PKG_NAME}@${PKG_VERSION} did not appear on npm within 15 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PKG_NAME: "@sriinnu/tokmeter-mcp"
