# ============================================================================
# Publish monorepo packages to npm with provenance on Release
# ============================================================================
#
# Adapted from the standalone workflow used in runic, kosha-discovery, etc.
# Extended for bun monorepo with multiple publishable packages.
#
# AUTHENTICATION: npm Trusted Publishing (OIDC) — no token.
#
# The job's own OIDC identity proves it is this workflow in this repo, so
# there is no NPM_TOKEN to store, rotate or leak, and it works with 2FA
# required on writes. npm is removing token-based direct publishing in
# January 2027, so this is also the path that keeps working.
#
# One-time setup, per package (@sriinnu/tokmeter and @sriinnu/tokmeter-mcp):
#   npmjs.com → package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: sriinnu
#     Repository:           tokmeter
#     Workflow filename:    publish.yml
#
# Requires npm >= 11.5.1 (installed below) and Node >= 22.14.
#
# To publish: bump versions → commit → create GitHub Release → workflow runs.
# ============================================================================

name: Release & Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job 1: Verify — build, lint, and test must pass before publishing
  # ==========================================================================
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # ==========================================================================
  # Job 2: Publish — only after verify succeeds
  # ==========================================================================
  publish:
    name: Publish to npm (with provenance)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # Trusted Publishing authenticates via the job's OIDC token instead of
      # an NPM_TOKEN. It needs npm >= 11.5.1, and Node 22 still ships npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Prepare and publish verified package artifacts
        run: |
          bash scripts/prepare-packages.sh "$RUNNER_TEMP/tokmeter-packages"
          for package in tokmeter mcp; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            # A local signed release can publish npm before creating the
            # GitHub release. Never attempt to overwrite that version.
            if npm view "$name@$version" version 2>/dev/null | grep -Fx "$version"; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "$RUNNER_TEMP/tokmeter-packages/$package-$version.tgz" --provenance --access public
          done

      # ======================================================================
      # Publish the MCP server manifest to the official registry.
      #
      # Runs AFTER npm publish on purpose: the registry proves namespace
      # ownership by fetching the published package and reading `mcpName`
      # out of its package.json, so the version has to exist on npm first.
      # Auth is the job's own OIDC token (`id-token: write` above) — it
      # proves the io.github.sriinnu/* namespace, so there is no interactive
      # login and no secret to rotate.
      # ======================================================================
      - name: Publish to the MCP registry
        working-directory: packages/mcp
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ASSET=mcp-publisher_linux_amd64.tar.gz ;;
            aarch64|arm64) ASSET=mcp-publisher_linux_arm64.tar.gz ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ASSET}" \
            -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          # server.json pins its own version; fail loudly rather than
          # registering a manifest that points at a different release.
          node -e '
            const fs = require("node:fs");
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_TAG.replace(/^v/, "");
            const seen = [srv.version, srv.packages[0].version, pkg.version];
            if (seen.some((v) => v !== tag)) {
              throw new Error(`version mismatch: tag ${tag} vs ${seen.join(", ")}`);
            }
            if (pkg.mcpName !== srv.name) {
              throw new Error(`mcpName ${pkg.mcpName} does not match server name ${srv.name}`);
            }
            if (srv.packages[0].identifier !== pkg.name) {
              throw new Error(`server.json package ${srv.packages[0].identifier} is not ${pkg.name}`);
            }
            // The registry caps description at 100 chars and rejects the
            // whole manifest with a 422 — after npm has already published,
            // so the release is half-done. Catch it before we get there.
            if ((srv.description ?? "").length > 100) {
              throw new Error(`server.json description is ${srv.description.length} chars; the registry allows 100`);
            }
          '
          # npm's read API lags its own publish by tens of seconds, and the
          # registry resolves the version before it will register anything.
          # Wait for the version to be readable instead of racing it.
          PKG_VERSION="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::${PKG_NAME}@${PKG_VERSION} did not appear on npm within 5 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PKG_NAME: "@sriinnu/tokmeter-mcp"
